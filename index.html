<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>stattstrack · MOG weekly</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0e1420;--card:#151d2c;--line:#243247;--text:#e8eef8;--muted:#8fa0b8;--gold:#ffc42d;--mint:#43e8a4;--coral:#ff4f6d;--cyan:#3fd9ff;--violet:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b1019;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
header h1{margin:0;font-size:17px;letter-spacing:.5px}
.pill{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text)}
.pill.ok{border-color:rgba(67,232,164,.5);color:var(--mint)}.pill.bad{border-color:rgba(255,79,109,.5);color:var(--coral)}.pill.gold{border-color:rgba(255,196,45,.6);color:var(--gold)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.tab.on{background:#1f2a3f;color:#fff;border-color:#3a4c6d}
main{max-width:1240px;margin:0 auto;padding:16px 18px 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.bar input{flex:1 1 240px;min-width:200px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;text-decoration:none}
.btn.warn{border-color:rgba(255,196,45,.6);color:var(--gold)}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
.log{font:12px/1.5 Consolas,monospace;color:var(--mint);background:#0f1a17;border:1px solid rgba(67,232,164,.3);border-radius:10px;padding:8px 12px;margin:0 0 12px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{background:#1a2436;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td.l,th.l{text-align:left}
td.name{max-width:280px;overflow:hidden;text-overflow:ellipsis;font-weight:700}
td.name img{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:8px;background:#0b1019;object-fit:cover}
td.name i{display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:8px;background:#26314a}
td.addr{color:var(--muted);font-size:12px;font-family:Consolas,monospace}
tr.me td{background:rgba(255,196,45,.12)}
tr.hot td{background:rgba(67,232,164,.08)}
td.gold{color:var(--gold);font-weight:700}
td.mint{color:var(--mint);font-weight:700}
td.cyan{color:var(--cyan);font-weight:700}
td.marb{color:#7fe3b8}
td.dim{color:var(--muted)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th.sortable.on{color:var(--gold)}
td.pos{color:#5f6f8a;font-size:12px}
.bar select,.bar label.pill input{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
.bar label.pill input{width:72px}
label.pill{display:inline-flex;align-items:center;gap:6px}
td.total{color:var(--gold);font-weight:900;font-size:16px}
.rank1 td.dim{color:var(--gold)}.rank2 td.dim{color:#cfd8e6}.rank3 td.dim{color:#e0a060}
.empty{padding:40px;text-align:center;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(63,217,255,.15);color:var(--cyan);margin-left:6px;vertical-align:middle}
.badge.new{background:rgba(255,79,109,.18);color:var(--coral);font-weight:900}
.mepin{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:rgba(255,196,45,.12);border:1px solid rgba(255,196,45,.5);font-weight:800}
.mepin b{color:var(--gold)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 14px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grp .t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.grp .n{font-size:22px;font-weight:900;color:var(--mint);margin:2px 0}
.grp .n small{font-size:13px;color:var(--muted);font-weight:700}
.grp .d{font-size:13px;color:var(--text);font-weight:700}
.grp .d span{color:var(--muted);font-weight:600}
.bar label.pill input[type=text]{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>🏆 stattstrack · MOG weekly</h1>
  <span class="pill" id="p-week">неделя: —</span>
  <span class="pill" id="p-last">последний опрос: —</span>
  <span class="pill" id="p-snap">снимок: —</span>
  <span class="pill" id="p-total">игроков: —</span>
  <span class="pill" id="p-wal">кошельки: —</span>
  <span class="pill" id="p-rate">курс: —</span>
  <div class="tabs">
    <button class="tab on" data-tab="live">Живой weekly</button>
    <button class="tab" data-tab="activity">Кто фармит сейчас</button>
    <button class="tab" data-tab="snapshot">Снимок</button>
    <button class="tab" data-tab="combined">Снимок + новая неделя</button>
  </div>
</header>
<main>
  <div class="bar">
    <input id="q" placeholder="поиск по нику или адресу">
    <select id="win" style="display:none">
      <option value="5">за 5 минут</option>
      <option value="15" selected>за 15 минут</option>
      <option value="30">за 30 минут</option>
      <option value="60">за 60 минут</option>
      <option value="180">за 3 часа</option>
    </select>
    <label class="pill" title="ник или адрес, который выделять во всех таблицах и показывать его место в сводной">мой ник <input id="mynick" type="text" placeholder="florencev" style="width:120px"></label>
    <label class="pill" id="l-onlynew" style="display:none"><input id="onlynew" type="checkbox"> только новые</label>
    <label class="pill" title="показывать только верх таблицы, без хвоста из тысячных мест">показывать <select id="topn"><option value="100">топ-100</option><option value="300">топ-300</option><option value="500">топ-500</option><option value="1000">топ-1000</option><option value="0">всех</option></select></label>
    <label class="pill">сортировка <select id="sort"></select></label>
    <label class="pill" title="скрыть игроков, у которых потрачено меньше ключей: убирает случайные значения «за ключ»">мин. ключей <input id="minkeys" type="number" min="0" step="10" placeholder="0"></label>
    <button class="btn" id="csv" type="button">⬇ CSV сводной</button>
    <span class="pill" id="p-polls">опросов: 0</span>
  </div>
  <div class="mepin" id="mepin" style="display:none"></div>
  <div class="groups" id="groups" style="display:none"></div>
  <p class="note" id="note"></p>
  <div class="log" id="snaplog" style="display:none"></div>
  <div id="table"></div>
</main>
<script>
(function () {
  var tab = 'live', data = null, act = null, q = '', win = 15, wal = null, onlyNew = false;
  var topN = 500; try { topN = Number(localStorage.getItem('lbTopN')) || 500; } catch (e) {}
  var withinTop = function (rank) { return !topN || !rank || rank <= topN; };
  var myNick = ''; try { myNick = (localStorage.getItem('lbMyNick') || '').trim(); } catch (e) {}
  var isMe = function (name, addr) { if (!myNick) return false; var m = myNick.toLowerCase(); return String(name || '').toLowerCase() === m || String(addr || '').toLowerCase() === m; };
  var walOf = function (addr) { return wal && wal.balances ? wal.balances[String(addr || '').toLowerCase()] : null; };
  var usdOf = function (addr) { var b = walOf(addr); return b && typeof b.usd === 'number' ? b.usd : null; };
  var fmtUsd = function (n) { return typeof n === 'number' ? '$' + n.toLocaleString('ru-RU') : '—'; };
  var rateCur = function () { return data && data.rates && data.rates.cur ? data.rates.cur.coinsPerUsd : null; };
  var ratePrev = function () { return data && data.rates && data.rates.prev ? data.rates.prev.coinsPerUsd : null; };
  var coinsUsd = function (coins, rate) { return rate && typeof coins === 'number' ? Math.round(coins / rate * 100) / 100 : null; };
  var fmtUsd2 = function (n) { return typeof n === 'number' ? '$' + n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—'; };
  var fmtEth = function (n) { return typeof n === 'number' ? n.toLocaleString('ru-RU', { maximumFractionDigits: 3 }) : '—'; };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmt = function (n) { return typeof n === 'number' ? n.toLocaleString('ru-RU') : (n == null ? '' : String(n)); };
  var fmt1 = function (n) { return typeof n === 'number' ? n.toLocaleString('ru-RU', { maximumFractionDigits: 1 }) : '—'; };
  var perKey = function (coins, keys) { coins = Number(coins) || 0; keys = Number(keys) || 0; return keys ? Math.round((coins / keys) * 10) / 10 : null; };
  var sgn = function (n) { return n == null ? '—' : (n > 0 ? '+' : '') + fmt(n); };
  var time = function (t) { return t ? new Date(t).toLocaleString('ru-RU', { hour12: false }) : '—'; };
  var NAME = ['displayName', 'username', 'name', 'nickname', 'playerName', 'player'], ADDR = ['address', 'wallet', 'walletAddress', 'userId', 'playerId', 'id'];
  var pick = function (row, keys) { for (var i = 0; i < keys.length; i++) if (row && row[keys[i]] != null && row[keys[i]] !== '') return row[keys[i]]; return null; };
  var shortAddr = function (a) { a = a == null ? '' : String(a); return a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : a; };
  var matches = function (name, addr) { if (!q) return true; var s = q.toLowerCase(); return String(name || '').toLowerCase().indexOf(s) >= 0 || String(addr || '').toLowerCase().indexOf(s) >= 0; };
  var avatar = function (url) { return url ? '<img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.replaceWith(document.createElement(\'i\'))">' : '<i></i>'; };
  var playerCell = function (name, addr, av) { return '<td class="l name" title="' + esc(addr) + '">' + avatar(av) + esc(name) + '</td>'; };

  var SORTS = {
    live: { rank: 'место', treasure: 'монеты', marbles: 'марблы', runCount: 'забеги', totalKeysSpent: 'ключи', perKey: 'монет за ключ', coinsUsd: '≈ $ выплата', usd: '$ на кошельке', ethAbs: 'ETH на Abstract', usdc: 'USDC.e' },
    combined: { rank: 'место', snapshot: 'снимок', current: 'новая неделя', total: 'TOTAL COINS', keysTotal: 'ключи всего', runsTotal: 'забеги всего', perKey: 'монет за ключ', coinsUsd: '≈ $ выплата', usd: '$ на кошельке' },
    activity: { rank: 'место', treasure: 'монеты сейчас', dTreasure: '+монеты за окно', dRuns: '+забеги', dKeys: '+ключи' }
  };
  var sortKey = 'rank', sortDir = 'asc', minKeys = 0;
  try { var sv = JSON.parse(localStorage.getItem('lbSort') || 'null'); if (sv) { sortKey = sv.k || 'rank'; sortDir = sv.d || 'asc'; minKeys = Number(sv.m) || 0; } } catch (e) {}
  function saveSort() { try { localStorage.setItem('lbSort', JSON.stringify({ k: sortKey, d: sortDir, m: minKeys })); } catch (e) {} }
  function kindOf() { return tab === 'combined' ? 'combined' : tab === 'activity' ? 'activity' : 'raw'; }
  function valueOf(r, key, kind) {
    if (key === 'perKey') return kind === 'raw' ? perKey(r.treasure, r.totalKeysSpent) : (typeof r.perKey === 'number' ? r.perKey : null);
    if (key === 'coinsUsd') return kind === 'raw' ? coinsUsd(r.treasure, tab === 'snapshot' ? ratePrev() : rateCur()) : combUsd(r);
    if (key === 'usd' || key === 'ethAbs' || key === 'usdc') { var b = walOf(kind === 'raw' ? pick(r, ADDR) : r.address); if (!b) return null; return key === 'usd' ? (typeof b.usd === 'number' ? b.usd : null) : key === 'ethAbs' ? ((b.eth || 0) + (b.weth || 0)) : (typeof b.usdc === 'number' ? b.usdc : null); }
    var v = r[key]; return typeof v === 'number' ? v : (v == null ? null : Number(v));
  }
  function keysOf(r, kind) { return kind === 'raw' ? (Number(r.totalKeysSpent) || 0) : kind === 'combined' ? (Number(r.keysTotal) || 0) : (Number(r.keys) || 0); }
  function orderRows(rows, kind) { // только переставляет строки; цифры и места из игры не меняются
    var out = rows.filter(function (r) { return !(minKeys > 0 && keysOf(r, kind) < minKeys); });
    if (sortKey === 'rank' && sortDir === 'asc') return out;
    out.sort(function (a, b) {
      var va = valueOf(a, sortKey, kind), vb = valueOf(b, sortKey, kind);
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      return sortDir === 'desc' ? vb - va : va - vb;
    });
    return out;
  }
  function th(key, label, cls) { var on = sortKey === key; return '<th class="sortable' + (cls ? ' ' + cls : '') + (on ? ' on' : '') + '" data-sort="' + key + '" title="сортировать">' + label + (on ? (sortDir === 'desc' ? ' ▼' : ' ▲') : '') + '</th>'; }
  var sortedMode = function () { return !(sortKey === 'rank' && sortDir === 'asc'); };
  var posCell = function (i) { return sortedMode() ? '<td class="dim pos">' + (i + 1) + '</td>' : ''; };
  var posHead = function () { return sortedMode() ? '<th title="позиция в текущей сортировке">№</th>' : ''; };
  function fillSortSelect() {
    var sel = $('#sort'), opts = SORTS[kindOf() === 'raw' ? 'live' : kindOf()], h = '';
    if (!opts[sortKey]) { sortKey = 'rank'; sortDir = 'asc'; }
    Object.keys(opts).forEach(function (k) { h += '<option value="' + k + '"' + (k === sortKey ? ' selected' : '') + '>' + esc(opts[k]) + (k === 'rank' ? '' : ' ▼') + '</option>'; });
    sel.innerHTML = h;
    $('#minkeys').value = minKeys || '';
  }

  function renderRaw(rec, label) { // как в игре: # · игрок · монеты · марблы · забеги · ключи, плюс монеты за ключ
    if (!rec) return '<div class="empty">' + esc(label) + ': данных ещё нет</div>';
    var rows = orderRows((rec.leaderboard || []).filter(function (r) { return q || withinTop(r.rank); }), 'raw'), meKey = rec.user ? String(pick(rec.user, ADDR) || '').toLowerCase() : '';
    var h = '<table><tr>' + posHead() + th('rank', '#') + '<th class="l">игрок</th><th class="l">адрес</th>' + th('treasure', '🪙 монеты') + th('marbles', '💚 марблы') + th('runCount', '🏃 забеги') + th('totalKeysSpent', '🔑 ключи') + th('perKey', '🪙 за ключ') + th('coinsUsd', '≈ $ выплата') + th('ethAbs', 'ETH Abstract') + th('usdc', 'USDC.e') + th('usd', '$ на кошельке') + '</tr>';
    var shown = 0;
    rows.forEach(function (r, i) {
      var name = pick(r, NAME), addr = pick(r, ADDR);
      if (!matches(name, addr)) return;
      var rank = r.rank || i + 1, me = (meKey && String(addr || '').toLowerCase() === meKey) || isMe(name, addr);
      if (rank === 301 && !q && !sortedMode() && !minKeys) h += '<tr><td colspan="12" class="l dim" style="text-align:center;background:#10182a">ниже топ-300 · обновляется реже (полный список раз в 5 минут, у конца недели раз в 30 секунд)</td></tr>';
      h += '<tr class="rank' + rank + (me ? ' me' : '') + '">' + posCell(shown) + '<td class="dim">' + rank + '</td>' + playerCell(name, addr, r.profilePictureUrl) + '<td class="l addr">' + esc(shortAddr(addr)) + '</td><td class="gold">' + fmt(r.treasure) + '</td><td class="marb">' + fmt(r.marbles) + '</td><td>' + fmt(r.runCount) + '</td><td class="dim">' + fmt(r.totalKeysSpent) + '</td><td class="cyan">' + fmt1(perKey(r.treasure, r.totalKeysSpent)) + '</td><td class="mint">' + fmtUsd2(coinsUsd(r.treasure, rec === data.snapshot ? ratePrev() : rateCur())) + '</td>' + walCells(addr) + '</tr>';
      shown++;
    });
    h += '</table>';
    if (!shown) h += '<div class="empty">ничего не найдено</div>';
    return h;
  }
  function walCells(addr) {
    var b = walOf(addr);
    if (!b) return '<td class="dim">—</td><td class="dim">—</td><td class="dim">—</td>';
    var eth = (b.eth || 0) + (b.weth || 0);
    return '<td class="dim">' + fmtEth(eth) + (b.ethMain ? ' <small title="плюс ETH в основной сети">+' + fmtEth(b.ethMain) + '</small>' : '') + '</td><td class="dim">' + (typeof b.usdc === 'number' ? b.usdc.toLocaleString('ru-RU', { maximumFractionDigits: 0 }) : '—') + '</td><td class="' + (b.usd >= 1000 ? 'gold' : 'dim') + '">' + fmtUsd(b.usd) + '</td>';
  }
  var combUsd = function (r) { var a = coinsUsd(r.snapshot, ratePrev()), b = coinsUsd(r.current, rateCur()); if (a == null && b == null) return null; return Math.round(((a || 0) + (b || 0)) * 100) / 100; };
  function renderCombined(c) {
    if (!c || !c.rows.length) return '<div class="empty">сводной ещё нет: нужен хотя бы один опрос</div>';
    var rows = orderRows(c.rows.filter(function (r) { return q || withinTop(r.rank); }), 'combined');
    if (onlyNew) rows = rows.filter(function (r) { return r.isNew; });
    var h = '<table><tr>' + posHead() + th('rank', '#') + '<th class="l">игрок</th><th class="l">адрес</th>' + th('snapshot', 'снимок (прошлая неделя)') + th('current', 'новая неделя') + th('total', 'TOTAL COINS') + th('keysTotal', '🔑 ключи всего') + th('runsTotal', '🏃 забеги всего') + th('perKey', '🪙 за ключ') + th('coinsUsd', '≈ $ выплата') + th('usd', '$ на кошельке') + '</tr>';
    var shown = 0;
    rows.forEach(function (r) {
      if (!matches(r.name, r.address)) return;
      var me = isMe(r.name, r.address);
      var cell = playerCell(r.name, r.address, r.avatar);
      if (r.isNew) cell = cell.replace('</td>', '<span class="badge new" title="в снимке прошлой недели его не было">НОВЫЙ</span></td>');
      h += '<tr' + (me ? ' class="me"' : '') + '>' + posCell(shown) + '<td class="dim">' + r.rank + '</td>' + cell + '<td class="l addr">' + esc(shortAddr(r.address)) + '</td><td class="dim">' + (r.isNew ? '—' : fmt(r.snapshot)) + '</td><td class="mint">' + (c.newWeek ? '+' + fmt(r.current) : '—') + '</td><td class="total">' + fmt(r.total) + '</td><td class="dim">' + fmt(r.keysTotal) + '</td><td title="снимок ' + fmt(r.runsSnapshot) + ' + новая неделя ' + fmt(r.runsCurrent) + '">' + fmt(r.runsTotal) + '</td><td class="cyan">' + fmt1(r.perKey) + '</td><td class="mint">' + fmtUsd2(combUsd(r)) + '</td><td class="' + (usdOf(r.address) >= 1000 ? 'gold' : 'dim') + '">' + fmtUsd(usdOf(r.address)) + '</td></tr>';
      shown++;
    });
    h += '</table>';
    if (!shown) h += '<div class="empty">ничего не найдено</div>';
    return h;
  }
  var GROUPS = [[1, 100, 'топ 1-100'], [101, 200, 'топ 101-200'], [201, 300, 'топ 201-300'], [301, 500, 'топ 301-500'], [501, 1000, 'места 501-1000'], [1001, Infinity, 'ниже 1000']];
  function renderGroups(a) {
    var box = $('#groups');
    if (tab !== 'activity' || !a || !data || !data.latest) { box.style.display = 'none'; return; }
    var sizes = {}, live = data.latest.leaderboard || [];
    GROUPS.forEach(function (g) { sizes[g[2]] = 0; });
    live.forEach(function (r) { var rk = Number(r.rank) || 0; GROUPS.forEach(function (g) { if (rk >= g[0] && rk <= g[1]) sizes[g[2]]++; }); });
    var h = '';
    GROUPS.forEach(function (g) {
      if (!sizes[g[2]] && g[1] === Infinity) return;
      var rows = a.rows.filter(function (r) { var rk = Number(r.rank) || 0; return rk >= g[0] && rk <= g[1]; });
      var active = rows.filter(function (r) { return !r.unknown && ((r.dTreasure || 0) > 0 || (r.dRuns || 0) > 0 || r.isNew); });
      var dT = 0, dR = 0, dK = 0; active.forEach(function (r) { dT += r.dTreasure || 0; dR += r.dRuns || 0; dK += r.dKeys || 0; });
      var pct = sizes[g[2]] ? Math.round(active.length / sizes[g[2]] * 100) : 0;
      h += '<div class="grp"><div class="t">' + g[2] + '</div><div class="n">' + active.length + ' <small>из ' + sizes[g[2]] + ' фармят · ' + pct + '%</small></div><div class="d">+' + fmt(dT) + ' 🪙 <span>· забегов +' + fmt(dR) + ' · ключей +' + fmt(dK) + '</span></div></div>';
    });
    box.innerHTML = h; box.style.display = h ? '' : 'none';
  }

  var DATA_BASE = 'https://raw.githubusercontent.com/Florencvv/stattstrack/data/';
  var bust = function () { return '?t=' + Date.now(); };
  var NAMEK = ['displayName', 'username', 'name', 'nickname', 'playerName', 'player'], ADDRK = ['address', 'wallet', 'walletAddress', 'userId', 'playerId', 'id'];
  var pk = function (row, keys) { for (var i = 0; i < keys.length; i++) if (row && row[keys[i]] != null && row[keys[i]] !== '') return row[keys[i]]; return null; };

    var snapWe = snap && snap.weekEnd ? new Date(snap.weekEnd).getTime() : null, curWe = cur && cur.weekEnd ? new Date(cur.weekEnd).getTime() : null;
    var newWeek = !!(snap && cur && snapWe && curWe && curWe > snapWe);

        keysSnapshot: newWeek ? e.keysSnapshot : 0, keysCurrent: newWeek ? e.keysCurrent : keysTotal, keysTotal: keysTotal, perKey: keysTotal ? Math.round(total / keysTotal * 10) / 10 : null,

  }
  var walTick = 0, actRaw = null;

  function load() {

  }
  function exportCsv() {
